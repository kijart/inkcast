[project]
name = "inkcast"
version = "0.1.0"
description = "Show web pages and images on Visionect e-ink displays (such as Joan) without the Visionect Software Suite."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pyvisionect[imaging]>=0.1.1",
    "playwright>=1.48",
    "aiohttp>=3.14.5",
]

[project.scripts]
inkcast = "inkcast.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.13,<0.14" # keep in sync with the uv image in Dockerfile

[tool.pytest.ini_options]
asyncio_mode = "auto"
