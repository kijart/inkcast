services:
  inkcast:
    image: ghcr.io/kijart/inkcast:latest # or Docker Hub: kijart/inkcast:latest
    build: .
    container_name: inkcast
    restart: unless-stopped
    ports:
      - 11113:11113
      - 8000:8000 # status page, if status_port = 8000 in config.toml
    volumes:
      - ./config.toml:/config/config.toml:ro
