# URL shown on any display not listed under [devices]. A web page is rendered with
# headless Chromium; an image (PNG, JPEG, ...) or file:///path/to/image.png is used as-is.
default_url = "http://example.com"

# Where displays connect (same port the Visionect server used).
host = "0.0.0.0"
port = 11113

# How often connected displays are re-rendered (only pushed if the page changed).
refresh_seconds = 300

# Wait after the page loads so client-side widgets can draw.
settle_seconds = 2.0

# Status page (HTML at / and JSON at /api/devices). Off when not set. No authentication:
# keep it on your local network.
status_port = 8000

# Per-display overrides, keyed by the UUID printed in the log when it connects.
# [devices."00112233-4455-6677-8899-aabbccddeeff"]
# name = "Kitchen"                   # shown on the status page
# url = "http://example.com/kitchen" # overrides default_url
# fit = "contain"                    # images only: contain (white bands), cover (crop) or stretch
# refresh_seconds = 60               # overrides the global refresh_seconds while connected
# rotate = 180                       # 0, 90, 180 or 270 (90/270 = portrait)
# sleep_minutes = 60                 # >0 tells a battery display to sleep after each update
# touch = false                      # turn the touch panel on (saved on the display; uses more battery)
